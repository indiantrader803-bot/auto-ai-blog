name: 24/7 Render Keep-Alive Pinger

on:
  schedule:
    # Runs every 5 minutes around the clock to prevent Render free instance from ever idling or sleeping
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping-keep-alive:
    name: Ping 24/7 Keep-Alive
    runs-on: ubuntu-latest
    steps:
      - name: Ping Production Health & Core Pages
        run: |
          echo "⚡ Sending keep-alive heartbeat pulses to Render instance..."
          curl -s -m 20 -o /dev/null -w "Health: %{http_code}\n" "https://auto-ai-blog-web.onrender.com/api/health" || echo "Health check pinged"
          curl -s -m 20 -o /dev/null -w "Home: %{http_code}\n" "https://auto-ai-blog-web.onrender.com/" || echo "Home pinged"
          curl -s -m 20 -o /dev/null -w "Community: %{http_code}\n" "https://auto-ai-blog-web.onrender.com/community" || echo "Community pinged"
          curl -s -m 20 -o /dev/null -w "Store: %{http_code}\n" "https://auto-ai-blog-web.onrender.com/store" || echo "Store pinged"
          echo "✅ All 24/7 keep-alive heartbeats dispatched successfully!"
          exit 0
