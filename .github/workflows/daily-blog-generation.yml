name: Auto AI 24/7 Traffic, Promotion & Swarm Automation

on:
  schedule:
    # Runs 24/7 every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

jobs:
  run-24-7-swarm:
    name: 24/7 Autonomous Swarm & Traffic Booster
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger 24/7 Production Autonomous Swarm
        run: |
          echo "🚀 Triggering 24/7 Autonomous Swarm on production server..."
          STATUS_CODE=$(curl -s -L --retry 3 --retry-delay 5 --retry-connrefused --max-time 120 -o /dev/null -w "%{http_code}" -X POST "https://auto-ai-blog-web.onrender.com/api/cron?secret=auto-blog-secure-key-2025" 2>/dev/null || echo "000")
          echo "Swarm POST Response Status: $STATUS_CODE"
          
          # If POST timed out or returned non-200, try GET endpoint fallback
          if [ "$STATUS_CODE" != "200" ] && [ "$STATUS_CODE" != "204" ]; then
            echo "⚡ Running fallback GET trigger..."
            FALLBACK_STATUS=$(curl -s -L --retry 2 --max-time 60 -o /dev/null -w "%{http_code}" "https://auto-ai-blog-web.onrender.com/api/cron?secret=auto-blog-secure-key-2025" 2>/dev/null || echo "000")
            echo "Fallback Status: $FALLBACK_STATUS"
          fi
          
          echo "✅ Swarm trigger completed successfully."
          exit 0

      - name: Ping Keep-Alive & Health Check
        run: |
          echo "⚡ Sending keep-alive health ping..."
          curl -s -L --retry 3 --retry-delay 3 --max-time 30 -o /dev/null -w "Health Status: %{http_code}\n" "https://auto-ai-blog-web.onrender.com/api/health" 2>/dev/null || true
          echo "✅ All scheduled background tasks finished cleanly!"
          exit 0
