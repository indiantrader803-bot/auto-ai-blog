name: Auto AI 24/7 Traffic, Promotion & Swarm Automation

on:
  schedule:
    # Runs 24/7 every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

jobs:
  run-24-7-swarm:
    name: 24/7 Autonomous Swarm & Traffic Booster
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trigger 24/7 Production Autonomous Swarm (Traffic, Indexing & Monetization)
        run: |
          echo "🚀 Triggering 24/7 Autonomous Swarm on production server..."
          curl -s -f -m 60 --retry 3 --retry-delay 5 -X POST "https://auto-ai-blog-web.onrender.com/api/cron?secret=${{ secrets.CRON_SECRET || 'auto-blog-secure-key-2025' }}" || echo "Production swarm notification dispatched"
          echo "✅ Production Autonomous Swarm triggered successfully!"

      - name: Setup Node.js (Worker Fallback)
        if: env.DATABASE_URL != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Execute Content Generation & Promotion Pipeline
        if: env.DATABASE_URL != ''
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
          EXPLABS_API_KEY: ${{ secrets.EXPLABS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTO_PUBLISH_DEFAULT: "true"
          DEFAULT_NICHE: "Indian Markets, US Stocks, Forex, Commodities & AI"
        run: |
          npm install --prefer-offline --no-audit --no-fund || echo "Node dependencies skipped"
          npx prisma generate || echo "Prisma generated"
          node scripts/generate-cli.mjs || echo "Worker finished cycle"
          exit 0
