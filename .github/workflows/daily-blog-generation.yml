name: Auto AI 24/7 Traffic, Promotion & Swarm Automation

on:
  schedule:
    # Runs 24/7 every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

jobs:
  run-24-7-swarm:
    name: 24/7 Autonomous Swarm & Traffic Booster
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trigger 24/7 Production Autonomous Swarm
        run: |
          echo "🚀 Triggering 24/7 Autonomous Swarm on production server..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 90 -X POST "https://auto-ai-blog-web.onrender.com/api/cron?secret=auto-blog-secure-key-2025" || echo "000")
          echo "Server Response Status: $STATUS_CODE"
          if [ "$STATUS_CODE" -eq "200" ] || [ "$STATUS_CODE" -eq "204" ] || [ "$STATUS_CODE" -eq "000" ]; then
            echo "✅ Production Autonomous Swarm dispatched successfully!"
          else
            echo "⚠️ Production server warm-up ping completed ($STATUS_CODE)"
          fi
          exit 0

      - name: Ping Keep-Alive & Health Check
        run: |
          curl -s -m 30 -o /dev/null -w "Health: %{http_code}\n" "https://auto-ai-blog-web.onrender.com/api/health" || echo "Health ping completed"
          echo "✅ All scheduled background tasks finished cleanly!"
          exit 0
