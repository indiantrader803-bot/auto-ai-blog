name: PropFlow-AI 24/7 Daily Affiliate Sales & Swarm Automation

on:
  schedule:
    - cron: '0 8 * * *' # Daily at 8:00 AM UTC
  workflow_dispatch:

jobs:
  run-propflow-sales-swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger PropFlow Master Orchestrator Swarm
        run: |
          echo "Triggering PropFlow-AI 15-Agent Swarm..."
          curl -s -L --retry 3 --max-time 60 -X POST https://auto-ai-blog-web.onrender.com/api/propflow \
            -H "Content-Type: application/json" \
            -d '{"action": "TRIGGER_DAILY_CYCLE"}' 2>/dev/null || echo "Swarm ping completed."

      - name: Trigger 24/7 Traffic Booster & Search Engine Pings
        run: |
          echo "Pinging Search Engines and Traffic Circulator..."
          curl -s -L --retry 2 --max-time 60 "https://auto-ai-blog-web.onrender.com/api/cron?secret=auto-blog-secure-key-2025" 2>/dev/null || echo "Cron ping completed."
          echo "✅ Daily PropFlow-AI sales swarm cycle completed."
          exit 0
